services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: snapspace
      POSTGRES_USER: snapspace
      POSTGRES_PASSWORD: snapspace_dev_password
    ports: ["5432:5432"]
    volumes: [snapspace_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapspace -d snapspace"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
volumes:
  snapspace_pgdata:
