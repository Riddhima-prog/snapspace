
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnapSpace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#222;font-family:Arial,sans-serif}
header{height:65px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-around;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:bold;color:#8b35d1}.wrap{max-width:950px;margin:25px auto;display:grid;grid-template-columns:minmax(0,600px) 280px;gap:25px;padding:0 12px}
.card{background:white;border:1px solid #ddd;border-radius:12px;margin-bottom:18px;padding:16px}
input,textarea,button{font:inherit;padding:11px;border:1px solid #ddd;border-radius:8px}
input,textarea{width:100%;margin:6px 0}button{cursor:pointer;background:#853bd1;color:white;border:0;font-weight:bold}
button.secondary{background:#eee;color:#333}button:disabled{opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.postimg{width:100%;max-height:550px;object-fit:contain;background:#f2f2f2;border-radius:8px;margin-top:10px}
.muted{color:#777;font-size:13px}.hidden{display:none}.posthead{display:flex;justify-content:space-between;align-items:center}
.story{display:inline-block;border:2px solid #c14bd5;border-radius:50%;padding:12px;margin:5px}
#auth{max-width:420px;margin:70px auto}.comment{padding:7px 0;border-top:1px solid #eee}
@media(max-width:700px){.wrap{display:block}header{justify-content:space-between;padding:0 15px}.side{display:none}}
</style>
</head>
<body>
<header>
 <div class="logo">SnapSpace ✦</div>
 <div id="userLabel" class="muted">Not signed in</div>
 <button id="logoutBtn" class="secondary hidden" onclick="logout()">Log out</button>
</header>

<section id="auth" class="card">
 <h2>Welcome to SnapSpace</h2>
 <p class="muted">Create an account or log in to join the community.</p>
 <input id="email" type="email" placeholder="Email address">
 <input id="password" type="password" placeholder="Password (minimum 6 characters)">
 <input id="username" placeholder="Username (for sign up)">
 <div class="actions">
  <button onclick="signup()">Create account</button>
  <button class="secondary" onclick="login()">Log in</button>
 </div>
 <p id="authMessage" class="muted"></p>
</section>

<div id="app" class="wrap hidden">
 <main>
  <section class="card">
   <h3>Share a moment 📸</h3>
   <input id="photo" type="file" accept="image/*">
   <textarea id="caption" placeholder="Write a caption..."></textarea>
   <button onclick="createPost()">Publish post</button>
   <p id="postMessage" class="muted"></p>
  </section>
  <h3>Your community feed</h3>
  <div id="feed"></div>
 </main>
 <aside class="side">
  <section class="card">
   <h3>Your profile</h3>
   <input id="fullName" placeholder="Your full name">
   <textarea id="bio" placeholder="Your bio"></textarea>
   <button onclick="saveProfile()">Save profile</button>
   <p id="profileMessage" class="muted"></p>
  </section>
  <section class="card">
   <h3>Discover people</h3>
   <div id="people"></div>
  </section>
 </aside>
</div>

<script>
/* ADD YOUR SUPABASE DETAILS BELOW */
const SUPABASE_URL = "https://wtlexluattzefvzkcxjh.supabase.co";
const SUPABASE_KEY = "sb_publishable_rqh7QKmoSJxmHHED5ZvS6Q_HYUIBKx-";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;

function safe(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function message(id,text){document.getElementById(id).textContent=text;}

async function signup(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const username=document.getElementById("username").value.trim().toLowerCase();
 if(!email||password.length<6||!username){
  return message("authMessage","Enter email, a password of at least 6 characters, and a username.");
 }
 const {data,error}=await db.auth.signUp({
  email,password,options:{data:{username,full_name:username}}
 });
 if(error)return message("authMessage",error.message);
 message("authMessage",data.session?"Account created!":"Check your email to confirm your account, then log in.");
 if(data.session) await loadApp(data.session.user);
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 if(error)return message("authMessage",error.message);
 await loadApp(data.user);
}

async function logout(){
 await db.auth.signOut();
 currentUser=null;
 document.getElementById("app").classList.add("hidden");
 document.getElementById("auth").classList.remove("hidden");
 document.getElementById("logoutBtn").classList.add("hidden");
 document.getElementById("userLabel").textContent="Not signed in";
}

async function loadApp(user){
 currentUser=user;
 document.getElementById("auth").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("logoutBtn").classList.remove("hidden");
 document.getElementById("userLabel").textContent=user.email;
 await loadProfile();
 await loadFeed();
 await loadPeople();
}

async function loadProfile(){
 const {data,error}=await db.from("profiles").select("*").eq("id",currentUser.id).single();
 if(error){message("profileMessage",error.message);return;}
 document.getElementById("fullName").value=data.full_name||"";
 document.getElementById("bio").value=data.bio||"";
}

async function saveProfile(){
 const {error}=await db.from("profiles").update({
  full_name:document.getElementById("fullName").value.trim(),
  bio:document.getElementById("bio").value.trim()
 }).eq("id",currentUser.id);
 message("profileMessage",error?error.message:"Profile updated!");
}

async function createPost(){
 const file=document.getElementById("photo").files[0];
 const caption=document.getElementById("caption").value.trim();
 if(!file)return message("postMessage","Choose a photo first.");
 if(!file.type.startsWith("image/"))return message("postMessage","Please choose an image.");
 if(file.size>5*1024*1024)return message("postMessage","Image must be under 5 MB.");
 message("postMessage","Uploading image...");
 const path=currentUser.id+"/"+crypto.randomUUID()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
 const {error:uploadError}=await db.storage.from("post-images").upload(path,file,{contentType:file.type});
 if(uploadError)return message("postMessage",uploadError.message);
 const {data:urlData}=db.storage.from("post-images").getPublicUrl(path);
 const {error}=await db.from("posts").insert({
  user_id:currentUser.id,image_url:urlData.publicUrl,caption
 });
 if(error)return message("postMessage",error.message);
 document.getElementById("photo").value="";
 document.getElementById("caption").value="";
 message("postMessage","Your post is published!");
 await loadFeed();
}

async function loadFeed(){
 const feed=document.getElementById("feed");
 feed.innerHTML="<p>Loading posts...</p>";
 const {data:posts,error}=await db.from("posts")
  .select("id,user_id,image_url,caption,created_at,profiles(username,full_name)")
  .order("created_at",{ascending:false}).limit(50);
 if(error){feed.textContent=error.message;return;}
 if(!posts.length){feed.innerHTML="<p>No posts yet. Be the first to share!</p>";return;}
 feed.innerHTML="";
 for(const post of posts){
  const [{data:likes},{data:comments},{data:myLike}] = await Promise.all([
   db.from("likes").select("user_id").eq("post_id",post.id),
   db.from("comments").select("id,content,user_id,created_at,profiles(username)").eq("post_id",post.id).order("created_at"),
   db.from("likes").select("post_id").eq("post_id",post.id).eq("user_id",currentUser.id).maybeSingle()
  ]);
  const liked=!!myLike;
  const commentsHtml=(comments||[]).map(c=>
   `<div class="comment"><b>${safe(c.profiles?.username||"user")}</b>: ${safe(c.content)}</div>`
  ).join("");
  const card=document.createElement("article");
  card.className="card";
  card.innerHTML=`
   <div class="posthead"><b>@${safe(post.profiles?.username||"user")}</b>
   <span class="muted">${new Date(post.created_at).toLocaleDateString()}</span></div>
   <img class="postimg" src="${safe(post.image_url)}" alt="Post image">
   <p>${safe(post.caption)}</p>
   <div class="actions">
    <button class="secondary" onclick="toggleLike('${post.id}',${liked})">${liked?"♥ Liked":"♡ Like"} (${likes?.length||0})</button>
    ${post.user_id===currentUser.id?`<button class="secondary" onclick="deletePost('${post.id}')">Delete</button>`:""}
   </div>
   <div>${commentsHtml}</div>
   <div class="actions"><input id="comment-${post.id}" placeholder="Write a comment...">
   <button onclick="addComment('${post.id}')">Comment</button></div>`;
  feed.appendChild(card);
 }
}

async function toggleLike(postId,liked){
 const result=liked
  ?await db.from("likes").delete().eq("post_id",postId).eq("user_id",currentUser.id)
  :await db.from("likes").insert({post_id:postId,user_id:currentUser.id});
 if(result.error)alert(result.error.message);
 await loadFeed();
}

async function addComment(postId){
 const input=document.getElementById("comment-"+postId);
 const content=input.value.trim();
 if(!content)return;
 const {error}=await db.from("comments").insert({
  post_id:postId,user_id:currentUser.id,content
 });
 if(error)return alert(error.message);
 await loadFeed();
}

async function deletePost(postId){
 if(!confirm("Delete this post?"))return;
 const {error}=await db.from("posts").delete().eq("id",postId).eq("user_id",currentUser.id);
 if(error)return alert(error.message);
 await loadFeed();
}

async function loadPeople(){
 const {data,error}=await db.from("profiles").select("id,username,full_name")
  .neq("id",currentUser.id).limit(20);
 const box=document.getElementById("people");
 if(error){box.textContent=error.message;return;}
 box.innerHTML="";
 for(const person of data){
  const {data:following}=await db.from("follows").select("following_id")
   .eq("follower_id",currentUser.id).eq("following_id",person.id).maybeSingle();
  const line=document.createElement("p");
  line.innerHTML=`<b>@${safe(person.username)}</b> `;
  const btn=document.createElement("button");
  btn.className="secondary";
  btn.textContent=following?"Following":"Follow";
  btn.onclick=()=>toggleFollow(person.id,!!following);
  line.appendChild(btn);box.appendChild(line);
 }
}

async function toggleFollow(id,following){
 const result=following
  ?await db.from("follows").delete().eq("follower_id",currentUser.id).eq("following_id",id)
  :await db.from("follows").insert({follower_id:currentUser.id,following_id:id});
 if(result.error)alert(result.error.message);
 await loadPeople();
}

db.auth.onAuthStateChange((event,session)=>{
 if(session?.user && !currentUser) loadApp(session.user);
});
(async()=>{
 const {data}=await db.auth.getSession();
 if(data.session)await loadApp(data.session.user);
})();
</script>
</body>
</html>
